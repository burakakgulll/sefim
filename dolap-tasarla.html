<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolabını Tasarla | Şefim İnşaat</title>
<meta name="description" content="Dolabınızı ölçünüze göre 3B tasarlayın: iç düzen, MDFlam ve suntalam kaplama seçin, teklif isteyin.">
<link rel="icon" href="assets/ikon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/ikon-180.png">
<script src="assets/ayarlar.js"></script>
<script src="assets/textures/katalog.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --ink:#1D2630; --muted:#5E6873; --line:#D3D8DD;
  --tape:#F2B705; --tape-ink:#1D2630; --draw:#2A333C; --danger:#B3261E; --ok:#2E7D4F;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15191E; --surface:#1F252C; --ink:#E8ECEF; --muted:#9AA4AE; --line:#333B44; --draw:#0E1216; --danger:#F2867E; --ok:#7FD1A0; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#15191E; --surface:#1F252C; --ink:#E8ECEF; --muted:#9AA4AE; --line:#333B44; --draw:#0E1216; --danger:#F2867E; --ok:#7FD1A0; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr;max-width:1320px;margin:0 auto}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 6px;border-bottom:1px solid var(--line)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px}
.tools{display:flex;gap:6px;align-items:center}
.mini{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mini button{border:0;background:transparent;padding:6px 11px;font-size:.82rem;font-weight:700;cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.toggle:disabled{opacity:.4;cursor:default}
.canvas{height:40vh;min-height:230px;position:relative}
#c2,#c3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#c2 svg{width:100%;height:100%;display:block}
#c3{touch-action:none;cursor:grab}
#c3 canvas{width:100%!important;height:100%!important;display:block}
.filigran{position:absolute;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:.07;user-select:none}
.filigran img{width:min(38%,260px);height:auto}
.filigran span{font-weight:800;letter-spacing:.3em;font-size:.8rem;color:var(--ink)}
.filigran .lb{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .filigran .lk{display:none} :root:not([data-theme="light"]) .filigran .lb{display:block} }
:root[data-theme="dark"] .filigran .lk{display:none} :root[data-theme="dark"] .filigran .lb{display:block}
.c3hint{position:absolute;right:0;bottom:2px;font-size:.75rem;color:var(--muted);pointer-events:none}
.hit{cursor:pointer}
.doorfab{position:absolute;left:0;bottom:6px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:var(--tape);color:var(--tape-ink);border:0;border-radius:999px;padding:11px 18px 11px 14px;font-weight:800;font-size:.95rem;box-shadow:0 2px 10px rgba(0,0,0,.28);cursor:pointer}
.doorfab:disabled{display:none}
.doorfab svg{width:20px;height:20px;flex:0 0 auto}
.swarns{position:absolute;left:0;right:0;top:4px;z-index:2;display:flex;flex-direction:column;gap:4px;max-height:50%;overflow-y:auto}
.swarns p{margin:0;background:var(--surface);border-left:4px solid var(--danger);padding:6px 10px;font-size:.8rem;line-height:1.3;border-radius:0 8px 8px 0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.swarns b{color:var(--danger)}

.panel{padding:14px 14px 28px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px}
.steps button{border:0;background:transparent;padding:8px 2px 10px;border-bottom:3px solid var(--line);cursor:pointer;text-align:left;font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.2}
.steps button b{display:block;font-size:1.05rem;color:var(--ink)}
.steps button[aria-current="step"]{border-color:var(--tape);color:var(--ink)}
.steps button.done{border-color:var(--ink)}

h2{font-size:1.35rem;margin:0 0 4px;letter-spacing:-.015em}
h3{font-size:1rem;margin:20px 0 8px}
.lead{color:var(--muted);margin:0 0 16px;font-size:.95rem;max-width:60ch}
.field{margin-bottom:18px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.field label,.label{font-weight:600;font-size:.95rem}
.label{display:block;margin-bottom:6px}
.numwrap{display:flex;align-items:center;gap:6px}
.numwrap input{width:76px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums;font-weight:600}
.unit{color:var(--muted);font-size:.85rem}
input[type=range]{width:100%;accent-color:var(--tape);height:28px}
.hint{color:var(--muted);font-size:.82rem;margin-top:4px;max-width:60ch}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:1.3rem;cursor:pointer;font-weight:600}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.warn{border-left:4px solid var(--danger);background:var(--surface);padding:8px 12px;margin:0 0 10px;font-size:.88rem;border-radius:0 8px 8px 0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.88rem;text-align:left;line-height:1.2}
.chip span{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--tape)}

.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;text-align:center;font-size:.85rem;font-weight:600}
.opt svg{display:block;margin:0 auto 6px;width:44px;height:58px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.88rem}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;cursor:pointer;font-weight:600;font-size:.86rem;line-height:1.2}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sw{border:0;background:none;cursor:pointer;padding:0;text-align:center;font-size:.76rem;width:62px}
.sw i{display:block;width:54px;height:54px;border-radius:10px;margin:0 auto 4px;border:1px solid var(--line)}
.sw[aria-pressed="true"] i{outline:3px solid var(--ink);outline-offset:2px}

.kp{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.kp-secili{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.kp-secili img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.kp-secili b{display:block}
.kp-secili span{font-size:.8rem;color:var(--muted)}
.kp-ara{display:flex;gap:8px;padding:10px 12px 0}
.kp-ara input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.kp-kat{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
.kp-kat button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700;cursor:pointer}
.kp-kat button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kp-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;padding:4px 12px 12px;max-height:300px;overflow-y:auto}
.kp-izgara button{border:0;background:none;padding:0;cursor:pointer;font-size:.72rem;line-height:1.2;text-align:center;color:var(--ink)}
.kp-izgara img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:4px;background:var(--bg)}
.kp-izgara button[aria-pressed="true"] img{outline:3px solid var(--tape);outline-offset:1px}
.kp-bos{grid-column:1/-1;color:var(--muted);font-size:.85rem;padding:8px 0}
.geri{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.geri img{height:30px;width:auto}
.geri .lb{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .geri .lk{display:none} :root:not([data-theme="light"]) .geri .lb{display:block} }
:root[data-theme="dark"] .geri .lk{display:none} :root[data-theme="dark"] .geri .lb{display:block}
.btn.wa{background:#1FAF54;border-color:#1FAF54;color:#fff}

.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.summary b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.summary span{font-size:.8rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem}
tr.grp td{font-weight:700;background:var(--bg)}
td.num{text-align:right}
.form{display:grid;gap:10px;margin-bottom:14px}
.form input,.form textarea,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.form select:disabled{opacity:1;color:var(--muted)}
.form .iki{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form textarea{min-height:70px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:8px}
.msg{font-size:.88rem;margin-top:8px;min-height:1.2em}
.msg.err{color:var(--danger)}.msg.good{color:var(--ok)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px;max-width:62ch}

@media (max-width:420px){ .brand small{display:none} }
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1.3fr) minmax(370px,1fr);min-height:100vh}
  .stage{height:calc(100vh - env(safe-area-inset-top,0px));border-bottom:0;border-right:1px solid var(--line);padding:20px 24px;display:flex;flex-direction:column}
  .canvas{flex:1;height:auto}
  .panel{padding:24px 28px 40px}
}
</style>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="Dolap önizleme">
    <div class="stage-head">
      <a class="geri" href="index.html" aria-label="Ana sayfaya dön"><img class="lk" src="assets/logo-koyu.png" alt="Şefim İnşaat"><img class="lb" src="assets/logo-beyaz.png" alt=""><span class="brand">Dolabını Tasarla<small id="dimtxt"></small></span></a>
      <div class="tools">
        <div class="mini" role="group" aria-label="Görünüm"><button type="button" data-view="2d">2B</button><button type="button" data-view="3d">3B</button></div>
      </div>
    </div>
    <div class="canvas">
      <div class="swarns" id="sw" role="status" aria-live="polite"></div>
      <button class="doorfab" id="doorToggle" type="button"></button>
      <div id="c2"></div>
      <div id="c3"><span class="c3hint">Sürükleyerek döndürün</span></div>
      <div class="filigran" aria-hidden="true"><img class="lk" src="assets/logo-koyu.png" alt=""><img class="lb" src="assets/logo-beyaz.png" alt=""><span>sefiminsaat</span></div>
    </div>
  </section>
  <section class="panel">
    <nav class="steps" id="steps" aria-label="Adımlar"></nav>
    <div id="stepBody"></div>
    <div class="nav">
      <button class="btn" id="prevBtn" type="button">Geri</button>
      <button class="btn primary" id="nextBtn" type="button">İleri</button>
    </div>
  </section>
</div>

<script>
/* ===== Üretici kuralları: atölyeye göre buradan değiştirin ===== */
const URETICI_EPOSTA = (window.FIRMA&&FIRMA.eposta) || "teklif@ornek.com";
const METRAJ_GOSTER = true; // false: malzeme listesi müşteriye gösterilmez, yalnızca teklif e-postasında gider
const T = 18;          // gövde ve kapak levha kalınlığı (mm)
const BAZA = 80;       // kapalı baza yüksekliği (mm)
const AYAK = 100;      // görünür ayak yüksekliği (mm)
const BAZA_GERI = 30;  // baza önünün gövde önünden içeride kaldığı pay (mm)
const ARKALIK = 3;     // arkalık kalınlığı (mm); gövdenin arkasına vidalanır, iç yüzü beyaz
const CEK_TABAN = 5;   // çekmece tabanı kalınlığı (mm), beyaz
const SURGU_D = 80;    // sürgü ray profilinin gövde içinde kapladığı derinlik (mm)
const CEKMECE_H = 200; // bir çekmece modül yüksekliği (mm)
const AYNA_KALINLIK = 4;
const CERCEVE_PAY = 80; // çerçeveli aynada kapak kenarından boşluk (mm)
const PLAKA = {w:2800, h:2100};
const DOKU_BOY = PLAKA.w; // kaplama görselinin damar yönündeki gerçek boyu (mm): görsel bir levha boyunu kaplar, parçalarda tekrar/ek izi oluşmaz
const FIRE = 1.15;
/* ================================================================ */

// Kaplamalar assets/textures/katalog.js dosyasından gelir (scripts/dokulari-hazirla.py üretir)
const KAPLAMALAR = (window.KAPLAMALAR&&window.KAPLAMALAR.length) ? window.KAPLAMALAR : [{id:"beyaz",ad:"Beyaz",kat:"Düz renk",hex:"#f1f0ec",en:1}];
const RENKLER = Object.fromEntries(KAPLAMALAR.map(k=>[k.id,k]));
const kaplama = id => RENKLER[id] || RENKLER.beyaz || KAPLAMALAR[0];
const dokuYol = id => `assets/textures/${id}.jpg`, kucukYol = id => `assets/textures/k/${id}.jpg`;
const KAP_KAT = ["Tümü",...[...new Set(KAPLAMALAR.map(k=>k.kat))]];
const GOVDE_MALZ = {suntalam:"Suntalam", mdflam:"MDFlam"};
const KAPAK_MALZ = {suntalam:"Suntalam", mdflam:"MDFlam"};
const KAPAK_MALZ_UZUN = {suntalam:"Suntalam", mdflam:"MDFlam"};
const KP = {color:{ara:"",kat:"Tümü"}, kcolor:{ara:"",kat:"Tümü"}}; // kaplama seçici filtreleri (kaydedilmez)
const TIPLER = { aski:"Askı + üst raf", uzun:"Uzun askı", raf:"Raflı", cekmece:"Çekmece + raf", karma:"Askı + çekmece" };
const KAPAK = {kapakli:"Kapaklı", surgu:"Sürgülü", acik:"Kapaksız"};
const KULP = {cubuk:"Çubuk", dugme:"Düğme", gomme:"Kulpsuz"};
const KULP_UZUN = {cubuk:"Çubuk kulp", dugme:"Düğme kulp", gomme:"Bas-aç (kulpsuz)"};
const AYNALAR = { gumus:{ad:"Gümüş",hex:"#C9D2D8"}, bronz:{ad:"Bronz",hex:"#B08F6C"}, fume:{ad:"Füme",hex:"#5E646A"}, buzlu:{ad:"Buzlu",hex:"#E4E8EB"} };
const AYNA_KAPSAM = {yok:"Yok", tek:"Tek kapak", donusumlu:"Dönüşümlü", sol:"Sol", sag:"Sağ", tumu:"Tümü"};
const SURGU_MAX_PANEL = 1200; // tek sürgü panelinin önerilen en büyük genişliği (mm); aşılırsa uyarı çıkar
const SURGU_BINDIRME = 40;    // sürgü panellerinin birbirinin üzerine binme payı (mm)
// Her bölmeye bir sürgü kapak: kapak birleşimleri ara dikmelere denk gelir, her bölme tam açılabilir
const surguAdet = () => Math.max(2, S.n);
const aynaSecenek = () => Object.fromEntries(["yok","tek","donusumlu","tumu"].map(k=>[k,AYNA_KAPSAM[k]]));
function aynaUyumla(){ if(!(S.ayna.kapsam in aynaSecenek())) S.ayna.kapsam = (S.ayna.kapsam==="sol"||S.ayna.kapsam==="sag") ? "tek" : "yok"; }
const AYNA_SEKIL = {tam:"Tam yüzey", cerceve:"Çerçeveli"};
const ADIMLAR = ["Ölçü","İç düzen","Gövde","Kapak","Teklif"];
const IL = (window.FIRMA&&FIRMA.il) || "Samsun";
const ILCELER = (window.FIRMA&&FIRMA.ilceler) || [];

function sec(type){return {type, raf: type==="cekmece"?2:4, cek:3}}
// İlk açılış: 5 kapaklı, ortası aynalı, sahra meşe kapak + beyaz gövde
const varsayilan = () => ({W:250,H:260,D:60,n:5,sections:[sec("uzun"),sec("aski"),{type:"cekmece",raf:3,cek:3},sec("aski"),sec("raf")],
  alt:"baza", ustOn:true, ustH:10, govdeMalz:"suntalam", color:"beyaz",
  door:"kapakli", kapakMalz:"mdflam", kColor:RENKLER["sahra-mese"]?"sahra-mese":"beyaz", handle:"cubuk",
  ayna:{kapsam:"tek",tip:"gumus",sekil:"tam"},
  showDoors:true, view:"3d", sel:0, step:0, musteri:{ad:"",tel:"",mail:"",ilce:"",not:""}});

let S;
try{ const raw=localStorage.getItem("dolap-v4"); const v=varsayilan(); S = raw ? Object.assign(v, JSON.parse(raw)) : v; S.ayna=Object.assign(varsayilan().ayna,S.ayna||{}); }catch(e){ S=varsayilan(); }
function save(){ try{ localStorage.setItem("dolap-v4", JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const r0 = x => Math.round(x);
function G(){
  const Wm=S.W*10, Hm=S.H*10, Dm=S.D*10, alt=S.alt==="ayak"?AYAK:BAZA, ust=S.ustOn?S.ustH*10:0;
  const gH=Hm-alt-ust, Hi=gH-2*T, si=(Wm-2*T-(S.n-1)*T)/S.n;
  return {Wm,Hm,Dm,Dc:Dm-ARKALIK,alt,ust,gH,Hi,si,top:Hm-ust}; // Dc: arkalık hariç gövde derinliği
}
function duzen(s,Hi){
  if(s.type==="aski")  return {raflar:[Hi-350], cubuklar:[Hi-420], cek:0};
  if(s.type==="uzun")  return {raflar:[], cubuklar:[Hi-80], cek:0};
  if(s.type==="raf"){ const k=s.raf; return {raflar:Array.from({length:k},(_,i)=>(i+1)*Hi/(k+1)), cubuklar:[], cek:0}; }
  if(s.type==="cekmece"){ const d=s.cek, b=d*CEKMECE_H, k=s.raf; return {raflar:[b,...Array.from({length:k},(_,i)=>b+(i+1)*(Hi-b)/(k+1))], cubuklar:[], cek:d}; }
  return {raflar:[2*CEKMECE_H, Hi-350], cubuklar:[Hi-420], cek:2};
}
function kapaklar(){
  const g=G(), out=[]; if(S.door==="acik") return out;

  if(S.step===0){
    b.innerHTML=`<h2>Ölçüler</h2><p class="lead">Dolabın konacağı duvarı ölçün.</p>
    ${olcuAlan("W","Genişlik",60,400,"Duvardan duvara ölçü")}
    ${olcuAlan("H",S.ustOn?"Tavan yüksekliği":"Dolap yüksekliği",150,300,S.ustOn?"Yerden tavana ölçün. Gövde bundan kısa üretilir, boşluğu üst baza kapatır.":"Yerden dolabın üstüne kadar")}
    ${olcuAlan("D","Derinlik",35,70,"Askılı dolaplar için 58–60 cm standarttır")}
    <div class="field row"><div><div class="label" style="margin:0">Bölme sayısı</div><div class="hint" id="bolmeHint">Her bölme yaklaşık ${(g.si/10).toFixed(0)} cm</div></div>${sayac("n",S.n,1,6)}</div>
    <h3>Dolabın altı</h3>${seg("alt",{baza:"Kapalı baza",ayak:"Ayaklı"},S.alt)}
    <h3>Dolabın üstü</h3>${seg("ust",{acik:"Boşluk kalsın",tavan:"Tavana kadar"},S.ustOn?"tavan":"acik")}
    ${S.ustOn?`<div class="field row"><div><div class="label" style="margin:0">Üst baza yüksekliği</div><div class="hint">Tavanla gövde arasını kapatır; dolabın yatırılıp kaldırılabilmesi için gerekir.</div></div>${sayac("ustH",S.ustH,5,25," cm")}</div>`:""}`;
  }
  if(S.step===1){
    const s=S.sections[S.sel];
    b.innerHTML=`<h2>İç düzen</h2><p class="lead">Bir bölme seçin, içine ne koyacağınızı belirleyin.</p>
    <div class="chips">${S.sections.slice(0,S.n).map((x,i)=>`<button type="button" class="chip" data-sel="${i}" aria-pressed="${i===S.sel}">${i+1}. bölme<span>${TIPLER[x.type]}</span></button>`).join("")}</div>
    <div class="options">${Object.keys(TIPLER).map(k=>`<button type="button" class="opt" data-type="${k}" aria-pressed="${s.type===k}">${ikon(k)}${TIPLER[k]}</button>`).join("")}</div>
    ${["raf","cekmece"].includes(s.type)?`<div class="field row"><div class="label" style="margin:0">Raf sayısı</div>${sayac("raf",s.raf,1,8)}</div>`:""}
    ${s.type==="cekmece"?`<div class="field row"><div class="label" style="margin:0">Çekmece sayısı</div>${sayac("cek",s.cek,1,4)}</div>`:""}
    <button type="button" class="link" id="applyAll">Bu düzeni tüm bölmelere uygula</button>`;
  }
  if(S.step===2){
    b.innerHTML=`<h2>Gövde</h2><p class="lead">Gövde; dikmeler, raflar ve tablalardır. İç yüzler de bu renkte olur.</p>
    <span class="label">Malzeme</span>${seg("gm",GOVDE_MALZ,S.govdeMalz)}
    <p class="hint" style="margin:-8px 0 16px">MDFlam vida tutuşu ve neme dayanımı daha iyidir, fiyatı daha yüksektir.</p>
    <span class="label">Kaplama</span>${kaplamaSecici("color",S.color)}`;
  }
  if(S.step===3){
    const ac=S.door==="acik";
    b.innerHTML=`<h2>Kapak</h2><p class="lead">Kapak açılacak yer dar ise sürgülü seçin.</p>
    <span class="label">Kapak tipi</span>${seg("door",KAPAK,S.door)}
    ${S.door==="surgu"?`<p class="hint" style="margin:-8px 0 16px">Her bölmeye bir sürgü kapak: ${surguAdet()} kapak, her biri yaklaşık ${((S.W*10-2*T)/surguAdet()/10+SURGU_BINDIRME/10).toFixed(0)} cm. Kapak sayısını değiştirmek için bölme sayısını değiştirin.</p>`:""}
    ${ac?"":`<span class="label">Kapak malzemesi</span>${seg("km",KAPAK_MALZ,S.kapakMalz)}
    <p class="hint" style="margin:-8px 0 16px">${{suntalam:"En ekonomik seçenek.",mdflam:"Suntalamdan daha sağlam, kenarları daha temiz."}[S.kapakMalz]}</p>
    <span class="label">Kapak kaplaması</span>${kaplamaSecici("kcolor",S.kColor)}
    ${S.door==="kapakli"?`<span class="label">Kulp</span>${seg("handle",KULP,S.handle)}`:""}
    <h3>Ayna</h3>${seg("ak",aynaSecenek(),S.ayna.kapsam)}
    ${""}`}`;
  }
  if(S.step===4){
    const L=liste(); let grp="";
    const fmt=r=>r.b?`${r.a} × ${r.b}`:(r.a?`${r.a}`:"–");
    const satir=L.rows.map(r=>{ let h=""; if(r.grup!==grp){grp=r.grup;h+=`<tr class="grp"><td colspan="4">${grp}</td></tr>`;} return h+`<tr><td>${r.ad}</td><td class="num">${r.adet}</td><td class="num">${fmt(r)}</td><td>${r.malz}</td></tr>`; }).join("");
    const kart=[...L.levha.map(l=>`<div><b>${l.m2.toFixed(1)} m²</b><span>${l.malz} (≈${l.adet} levha)</span></div>`), ...L.kenar.map(k=>`<div><b>${k.m.toFixed(0)} m</b><span>Kenar bandı, ${k.malz}</span></div>`), L.ayna?`<div><b>${L.ayna.toFixed(2)} m²</b><span>Ayna, ${AYNALAR[S.ayna.tip].ad}</span></div>`:""].join("");
    const m=S.musteri;
    const ozet=`<div class="summary"><div><b>${S.W}×${S.H}×${S.D}</b><span>Ölçü (cm)</span></div><div><b>${S.n} bölme</b><span>${KAPAK[S.door]}</span></div>
      <div><b>${kaplama(S.color).ad}</b><span>Gövde, ${GOVDE_MALZ[S.govdeMalz]}</span></div>${S.door!=="acik"?`<div><b>${kaplama(S.kColor).ad}</b><span>Kapak, ${KAPAK_MALZ[S.kapakMalz]}</span></div>`:""}</div>`;
    b.innerHTML=(METRAJ_GOSTER?`<h2>Malzeme listesi</h2><p class="lead">Ölçüler milimetredir. Liste ön hesaptır; kesin ölçüyü üretici yerinde ölçüm sonrası verir.</p>
    <div class="summary">${kart}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Parça</th><th class="num">Adet</th><th class="num">Ölçü (mm)</th><th>Malzeme</th></tr></thead><tbody>${satir}</tbody></table></div>
    <h3>Teklif isteyin</h3>`:`<h2>Tasarımınız hazır</h2>${ozet}`)+`<p class="lead">Bilgilerinizi bırakın; tasarımınız ve ölçüleriniz bize ulaşsın, size dönüş yapalım.</p>
    <div class="form">
      <input data-m="ad" placeholder="Ad soyad" autocomplete="name" value="${esc(m.ad)}">
      <input data-m="tel" placeholder="+90 5XX XXX XX XX" type="tel" autocomplete="tel" value="${esc(m.tel||"+90 ")}">
      <input data-m="mail" placeholder="E-posta (isteğe bağlı)" type="email" autocomplete="email" value="${esc(m.mail)}">
      <div class="iki"><select disabled aria-label="İl"><option>${IL}</option></select>
      <select data-m="ilce" aria-label="İlçe"><option value="">İlçe seçin</option>${ILCELER.map(x=>`<option${m.ilce===x?" selected":""}>${x}</option>`).join("")}</select></div>
      <textarea data-m="not" placeholder="Not (ör. tavan eğimli, priz var)">${esc(m.not)}</textarea>
    </div>
    <div class="actions"><button class="btn wa" id="waBtn" type="button">WhatsApp'tan gönder</button><a class="btn primary" id="sendBtn" href="#">E-postayla gönder</a></div>
    <div class="msg" id="msg"></div>
    ${METRAJ_GOSTER?`<p class="note">Hesap varsayılan atölye kurallarıyla yapılır (${T} mm levha, ${BAZA} mm baza, ${ARKALIK} mm arkalık). Üretici kendi kurallarına göre düzeltir.</p>`:""}`;
  }
  $("#prevBtn").style.visibility=S.step===0?"hidden":"visible";
  $("#nextBtn").style.visibility=S.step===4?"hidden":"visible";
  $("#nextBtn").textContent=S.step===3?(METRAJ_GOSTER?"Listeyi gör":"Teklif al"):"İleri";
  $("#steps").innerHTML=ADIMLAR.map((a,i)=>`<button type="button" data-step="${i}" ${i===S.step?'aria-current="step"':""} class="${i<S.step?"done":""}"><b>${i+1}</b>${a}</button>`).join("");
}

// listeli=false: WhatsApp için kısa özet (malzeme listesi yalnızca e-postada gider)
function metin(listeli=true){
  const L=liste(), m=S.musteri;
  let t=`DOLAP TEKLİF TALEBİ\n\nMüşteri: ${m.ad}\nTelefon: ${m.tel}\nE-posta: ${m.mail||"-"}\nKonum: ${m.ilce?m.ilce+" / ":""}${IL}\nNot: ${m.not||"-"}\n\n`;
  t+=`Ölçü: ${S.W} × ${S.H} × ${S.D} cm (G×Y×D)${S.ustOn?`, tavana kadar, üst baza ${S.ustH} cm`:""}\nAlt: ${S.alt==="baza"?"Kapalı baza":"Ayaklı"}\nBölme: ${S.n}\n`;
  t+=`Gövde: ${GOVDE_MALZ[S.govdeMalz]} ${kaplama(S.color).ad}\nKapak: ${KAPAK[S.door]}${S.door!=="acik"?`, ${KAPAK_MALZ_UZUN[S.kapakMalz]} ${kaplama(S.kColor).ad}`:""}${S.door==="kapakli"?`, ${KULP_UZUN[S.handle]}`:""}\n`;
  if(S.door!=="acik"&&S.ayna.kapsam!=="yok") t+=`Ayna: ${AYNA_KAPSAM[S.ayna.kapsam]}, gümüş, kapak boyu\n`;
  S.sections.slice(0,S.n).forEach((s,i)=>{ t+=`  ${i+1}. bölme: ${TIPLER[s.type]}${["raf","cekmece"].includes(s.type)?`, ${s.raf} raf`:""}${s.type==="cekmece"?`, ${s.cek} çekmece`:""}\n`; });
  if(!listeli) return t;
  t+=`\nMALZEME LİSTESİ (mm)\n`; let grp="";
  L.rows.forEach(r=>{ if(r.grup!==grp){grp=r.grup;t+=`\n[${grp}]\n`;} t+=`- ${r.ad}: ${r.adet} adet${r.b?` | ${r.a}×${r.b}`:r.a?` | ${r.a}`:""} | ${r.malz}\n`; });
  t+=`\n`; L.levha.forEach(l=>t+=`${l.malz}: ${l.m2.toFixed(2)} m² (≈${l.adet} levha)\n`);
  if(L.ayna) t+=`Ayna: ${L.ayna.toFixed(2)} m²\n`; L.kenar.forEach(k=>t+=`Kenar bandı ${k.malz}: ${k.m.toFixed(0)} m\n`);
  return t;
}

/* ===== Olaylar ===== */
function guncelle(adimDa){ save(); cizim(); if(adimDa) adimCiz(); }
function canli(){ const h=$("#bolmeHint"); if(h) h.textContent=`Her bölme yaklaşık ${(G().si/10).toFixed(0)} cm`; const w=$("#warns"); if(w) w.innerHTML=uyariHTML(); save(); cizim(); }
document.addEventListener("input",e=>{
  const k=e.target.dataset.k;
  if(k){ const el=e.target, v=+el.value; if(el.type==="range"||(v>=+el.min&&v<=+el.max)){ S[k]=v; document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>{ if(x!==el) x.value=v; }); canli(); } }
  const mk=e.target.dataset.m; if(mk){ S.musteri[mk]=e.target.value; save(); }
  const ka=e.target.dataset.kpara; if(ka){ KP[ka].ara=e.target.value; kaplamaFiltre(ka); }
});
document.addEventListener("change",e=>{ const k=e.target.dataset.k; if(k&&e.target.type==="number"){ const el=e.target; S[k]=Math.min(+el.max,Math.max(+el.min,+el.value||+el.min)); guncelle(true); } });
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); if(!t) return; const d=t.dataset;
  if(d.view){ S.view=d.view; guncelle(false); return; }
  if(d.step!==undefined){ git(+d.step); return; }
  if(d.inc||d.dec){
    const id=d.inc||d.dec, dir=d.inc?1:-1;
    if(id==="n"){ S.n=Math.min(6,Math.max(1,S.n+dir)); while(S.sections.length<S.n) S.sections.push(sec(["aski","raf","karma"][S.sections.length%3])); if(S.sel>=S.n) S.sel=S.n-1; }
    else if(id==="ustH") S.ustH=Math.min(25,Math.max(5,S.ustH+dir));
    else { const s=S.sections[S.sel], lim=id==="raf"?[1,8]:[1,4]; s[id]=Math.min(lim[1],Math.max(lim[0],s[id]+dir)); }
    guncelle(true); return;
  }
  if(d.sel!==undefined){ S.sel=+d.sel; guncelle(true); return; }
  if(d.type){ const s=S.sections[S.sel]; s.type=d.type; if(d.type==="cekmece"&&s.raf>4) s.raf=2; guncelle(true); return; }
  if(t.id==="applyAll"){ const s=S.sections[S.sel]; S.sections=S.sections.map(()=>({...s})); guncelle(true); return; }
  if(d.alt){ S.alt=d.alt; guncelle(true); return; }
  if(d.ust){ S.ustOn=d.ust==="tavan"; guncelle(true); return; }
  if(d.gm){ S.govdeMalz=d.gm; guncelle(true); return; }
  if(d.color){ S.color=d.color; kaplamaSecildi("color"); return; }
  if(d.kcolor){ S.kColor=d.kcolor; S.showDoors=true; kaplamaSecildi("kcolor"); return; }
  if(d.door){ S.door=d.door; aynaUyumla(); S.showDoors=true; guncelle(true); return; }
  if(d.km){ S.kapakMalz=d.km; S.showDoors=true; guncelle(true); return; }
  if(d.kpkat){ const [a,k]=d.kpkat.split("|"); KP[a].kat=k; kaplamaFiltre(a); return; }
  if(d.handle){ S.handle=d.handle; S.showDoors=true; guncelle(true); return; }
  if(d.ak){ S.ayna.kapsam=d.ak; S.showDoors=true; guncelle(true); return; }
  if(d.at){ S.ayna.tip=d.at; S.showDoors=true; guncelle(true); return; }
  if(d.as){ S.ayna.sekil=d.as; S.showDoors=true; guncelle(true); return; }
  if(t.id==="doorToggle"){ S.showDoors=!S.showDoors; save(); if(S.view==="3d") cizimToggleOnly(); else cizim(); return; }
  if(t.id==="prevBtn"){ git(S.step-1); return; }
  if(t.id==="nextBtn"){ git(S.step+1); return; }
  if(t.id==="sendBtn"){
    const msg=$("#msg");
    if(!S.musteri.ad.trim()||!telTam()){ e.preventDefault(); msg.className="msg err"; msg.textContent="Ad soyad ve telefon numaranızı eksiksiz girin."; return; }
    t.href=`mailto:${URETICI_EPOSTA}?subject=${encodeURIComponent("Dolap teklif talebi – "+S.musteri.ad)}&body=${encodeURIComponent(metin())}`; t.target="_blank";
    msg.className="msg good"; msg.textContent="E-posta uygulamanız açılıyor. Açılmazsa listeyi kopyalayıp gönderin."; return;
  }
  if(t.id==="waBtn"){
    const msg=$("#msg");
    if(!S.musteri.ad.trim()||!telTam()){ msg.className="msg err"; msg.textContent="Ad soyad ve telefon numaranızı eksiksiz girin."; return; }
    window.open(FIRMA.waLink("Merhaba, sitenizde dolap tasarladım.\n\n"+metin(false)),"_blank","noopener");
    msg.className="msg good"; msg.textContent="WhatsApp açılıyor; mesajı göndermeyi unutmayın."; return;
  }
});
function cizimToggleOnly(){ kapakDugme(); }
function kapakDugme(){
  const v3=S.view==="3d", acik=!S.showDoors;
  const ikon = acik
    ? '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="2" width="14" height="16" rx="1"/><line x1="10" y1="2" x2="10" y2="18"/></svg>'
    : '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="16" rx="1"/><path d="M7 2 L2 5 V19 L7 18"/></svg>';
  const yazi = v3 ? (acik?"Kapakları kapat":"Kapakları aç") : (acik?"Kapakları göster":"Kapakları gizle");
  $("#doorToggle").innerHTML = ikon + yazi;
}
function git(i){
  if(i<0||i>4) return; const onceki=S.step; S.step=i;
  if(i===1) S.showDoors=false; else if(onceki===1||i===3) S.showDoors=true;
  guncelle(true);
  if(window.matchMedia("(max-width:899px)").matches) document.querySelector(".panel").scrollIntoView({block:"start"});
}
S.ayna.tip="gumus"; S.ayna.sekil="tam"; // tek ayna tipi: gümüş, tam yüzey
if(!(S.kapakMalz in KAPAK_MALZ)) S.kapakMalz="mdflam";
if(!RENKLER[S.color]) S.color="beyaz";
if(!RENKLER[S.kColor]) S.kColor="beyaz";
aynaUyumla();
guncelle(true);
</script>
</body>
</html>
